<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">L5, un început în cosmos</title>
  <desc id="desc">Ilustrație cosmică în tonuri de verde petrol și auriu, cu o planetă inelată și stele discrete în mișcare.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08191b"/>
      <stop offset="0.54" stop-color="#123132"/>
      <stop offset="1" stop-color="#1b4140"/>
    </linearGradient>
    <radialGradient id="planet" cx="32%" cy="26%" r="78%">
      <stop offset="0" stop-color="#d4c39d"/>
      <stop offset="0.48" stop-color="#6caaa0"/>
      <stop offset="1" stop-color="#286365"/>
      </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6a66f" stop-opacity="0.1"/>
      <stop offset="0.48" stop-color="#f0d7a8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#d6a66f" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="24"/>
    </clipPath>
    <style>
      .star { animation: shimmer 4s ease-in-out infinite alternate; }
      .star:nth-of-type(3n) { animation-delay: 1.3s; }
      .star:nth-of-type(4n) { animation-delay: 2.4s; }
      .star { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .25s ease, opacity .25s ease; }
      .star:hover { opacity: 1; transform: scale(2.8); }
      .comet { animation: drift 12s ease-in-out infinite; }
      .orbit { cursor: pointer; transition: stroke-opacity .3s ease, stroke-width .3s ease; }
      .orbit:hover { stroke-opacity: .95; stroke-width: 4; }
      .interactive-planet { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .35s ease, filter .35s ease; }
      .interactive-planet:hover { filter: drop-shadow(0 0 14px rgba(228, 201, 149, .8)); transform: scale(1.08); }
      @keyframes shimmer { from { opacity: .28; } to { opacity: .95; } }
      @keyframes drift { 0%, 12% { transform: translate(-120px, 90px); opacity: 0; } 24% { opacity: .85; } 62%, 100% { transform: translate(500px, -200px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .star, .comet { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <path d="M0 324 C190 277 358 355 540 310 S925 275 1200 321 V400 H0Z" fill="#0a2223" opacity=".72"/>
    <path d="M0 345 C240 302 370 372 610 333 S990 304 1200 340" fill="none" stroke="#8db8a8" stroke-opacity=".14"/>
    <path d="M0 365 C240 322 370 392 610 353 S990 324 1200 360" fill="none" stroke="#d5b17b" stroke-opacity=".16"/>
    <g fill="#f2ead8">
      <circle class="star" cx="72" cy="72" r="1.7"/>
      <circle class="star" cx="168" cy="128" r="1.3"/>
      <circle class="star" cx="286" cy="57" r="1.8"/>
      <circle class="star" cx="410" cy="108" r="1.4"/>
      <circle class="star" cx="530" cy="50" r="1.7"/>
      <circle class="star" cx="640" cy="120" r="1.8"/>
      <circle class="star" cx="750" cy="65" r="1.3"/>
      <circle class="star" cx="1092" cy="74" r="1.8"/>
      <circle class="star" cx="1145" cy="167" r="1.3"/>
      <circle class="star" cx="1066" cy="292" r="1.5"/>
      <circle class="star" cx="680" cy="281" r="1.2"/>
      <circle class="star" cx="258" cy="276" r="1.6"/>
    </g>
    <g class="comet">
      <path d="M48 198 L230 140" stroke="url(#ring)" stroke-width="1.5"/>
      <circle cx="230" cy="140" r="2.5" fill="#f0d7a8"/>
    </g>
    <g class="orbit" fill="none" stroke="#d8c49b" stroke-opacity=".42">
      <circle cx="917" cy="191" r="112" stroke-dasharray="1 8"/>
      <ellipse cx="917" cy="191" rx="178" ry="54" stroke="url(#ring)" stroke-width="2" transform="rotate(-18 917 191)"/>
    </g>
    <g class="interactive-planet">
      <circle cx="917" cy="191" r="70" fill="url(#planet)"/>
      <path d="M858 182 Q917 151 976 182 M862 211 Q917 183 972 211 M880 238 Q917 221 954 238" fill="none" stroke="#e1d4b5" stroke-opacity=".35" stroke-width="4"/>
    </g>
      <path d="M746 191 H790 M1044 191 H1088 M917 20 V53 M917 329 V362" stroke="#c6a575" stroke-opacity=".38"/>
    <circle cx="917" cy="79" r="3" fill="#dfb67d"/>
    <text x="92" y="130" fill="#d9bb8f" font-family="Arial, sans-serif" font-size="12" letter-spacing="4">PROIECT WEB · 01</text>
    <text x="88" y="222" fill="#f4eddf" font-family="Georgia, serif" font-size="112" font-weight="700">L5</text>
    <path d="M94 248 H284" stroke="#d6a66f" stroke-width="2"/>
    <text x="94" y="282" fill="#c4d5c9" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">UN ÎNCEPUT ÎN COSMOS</text>
    <text x="94" y="327" fill="#86aaa0" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.5">HTML · FĂRĂ DEPENDENȚE</text>
  </g>
</svg>