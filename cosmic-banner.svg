<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">L5, un salut din spațiu</title>
  <desc id="desc">Un cer cosmic cu stele animate, o planetă cu inele și o cometă în mișcare.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102d43"/>
      <stop offset="1" stop-color="#163c4b"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e0d1"/>
      <stop offset="1" stop-color="#347eaa"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc982" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff2cd"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
    <style>
      .star { animation: twinkle 3s ease-in-out infinite alternate; }
      .star:nth-of-type(3n) { animation-delay: 1.1s; }
      .star:nth-of-type(4n) { animation-delay: 2s; }
      .comet { animation: fly 8s linear infinite; }
      .orbit { transform-origin: 910px 180px; animation: turn 24s linear infinite; }
      @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
      @keyframes fly { 0%, 15% { transform: translate(-180px, 85px); opacity: 0; } 20% { opacity: 1; } 55%, 100% { transform: translate(420px, -160px); opacity: 0; } }
      @keyframes turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .star, .comet, .orbit { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#sky)"/>
    <path d="M0 300 Q250 225 510 310 T1200 270 V360 H0Z" fill="#0a2232" opacity=".55"/>
    <g fill="#f5f2df">
      <circle class="star" cx="82" cy="62" r="2"/>
      <circle class="star" cx="185" cy="112" r="1.5"/>
      <circle class="star" cx="310" cy="48" r="2"/>
      <circle class="star" cx="440" cy="94" r="1.5"/>
      <circle class="star" cx="535" cy="42" r="1.8"/>
      <circle class="star" cx="655" cy="112" r="2"/>
      <circle class="star" cx="750" cy="55" r="1.5"/>
      <circle class="star" cx="1080" cy="68" r="2"/>
      <circle class="star" cx="1140" cy="155" r="1.5"/>
      <circle class="star" cx="1040" cy="284" r="1.7"/>
      <circle class="star" cx="700" cy="270" r="1.4"/>
      <circle class="star" cx="270" cy="270" r="1.8"/>
    </g>
    <g class="comet">
      <path d="M80 165 L290 105" stroke="url(#comet)" stroke-width="2"/>
      <circle cx="290" cy="105" r="3" fill="#fff2cd"/>
    </g>
    <g class="orbit" fill="none" stroke="#9ce7de" stroke-opacity=".55">
      <ellipse cx="910" cy="180" rx="138" ry="42" stroke-width="3" transform="rotate(-22 910 180)"/>
    </g>
    <circle cx="910" cy="180" r="64" fill="url(#planet)"/>
    <path d="M856 181 Q910 155 964 181 M866 207 Q910 190 954 207" fill="none" stroke="#b4f1df" stroke-opacity=".38" stroke-width="5"/>
    <text x="88" y="168" fill="#f4f4e9" font-family="Georgia, serif" font-size="68" font-weight="700">L5</text>
    <text x="92" y="207" fill="#a9d8d2" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">UN MIC SALUT DIN COSMOS</text>
    <path d="M92 232 H250" stroke="#f3bb76" stroke-width="3"/>
  </g>
</svg>